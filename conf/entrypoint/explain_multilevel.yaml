# @package _global_
defaults:
  - /dataset: naf
  - _self_

run_id: "???"          # MLflow run_id of the multi-level model to explain

n_captum: 200          # examples for Captum IG (slow: ~n_steps × batch forward passes,
                       # run once per hierarchy level, so cost scales ×5 vs. src.explain)
captum_batch_size: 4   # smaller batch: Captum multiplies by n_steps internally
batch_size: 32         # plain forward passes: label attention, self-attention, faithfulness
captum_top_k: null     # classes to run IG on per example (null = all classes at that level;
                       # cost scales ~linearly with this — cap it for section/division too if slow)
label_attn_top_k: null # classes to keep in label_attn.npz per example (null = all classes,
                       # in raw class-id order; cap this if the upload is too large — cumulative
                       # classes across the 5 levels can make it so, see
                       # scripts/resume_multilevel_explain.py for the incident this fixes)

n_self_attn: 50        # examples for seq_len × seq_len self-attention matrices
                       # (only produced if the shared encoder has a transformer — it
                       # doesn't today, multi-level training is FastText-only)

n_faithfulness: 50               # examples for the deletion-curve faithfulness test
faithfulness_fractions:          # word-removal levels (fraction of the sentence's words)
  - 0.0
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 1.0
faithfulness_n_random: 3         # random-removal draws averaged per level (control curve)

seed: 42

hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: INFO
